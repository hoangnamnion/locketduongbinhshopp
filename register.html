<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
    <title>Đăng ký Locket Gold</title>
    <link href="assets/images/favicon.ico" rel="icon" type="image/x-icon"/>
    <link href="assets/css/app-Bjnb32xO.css" rel="stylesheet"/>
    <link href="assets/css/style.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 dark:bg-[#09090b] text-text dark:text-gray-200 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Nền chấm bi mờ mờ -->
    <div class="absolute inset-0 pointer-events-none opacity-[0.12] dark:opacity-20 z-0" style="background-image: radial-gradient(#fbba00 1.5px, transparent 1.5px); background-size: 32px 32px;"></div>
    <!-- Vệt sáng màu bên trái -->
    <div class="absolute -left-20 top-10 w-72 h-72 bg-amber-300/30 rounded-full blur-3xl pointer-events-none"></div>
    <!-- Vệt sáng màu bên phải -->
    <div class="absolute right-0 bottom-10 w-96 h-96 bg-orange-300/20 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="w-full max-w-[420px] p-6 relative z-10 animate-[modalIn_0.3s_ease]">
        <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl rounded-[32px] p-8 sm:p-10 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/50 dark:border-zinc-800/50">
            <div class="flex flex-col items-center mb-8">
                <a href="index.html" class="mb-5 transition-transform hover:scale-105">
                    <img alt="Locket Gold" class="w-16 h-16 object-contain drop-shadow-md" src="assets/images/logo-locket.png"/>
                </a>
                <h1 class="text-2xl font-black text-gray-900 dark:text-white mb-2">Tạo tài khoản mới</h1>
                <p class="text-sm text-gray-500 dark:text-gray-400 text-center leading-relaxed">Đăng ký để nhận ưu đãi và mua Locket Gold nhanh chóng.</p>
            </div>
            
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="username">Tên đăng nhập (Username)</label>
                    <input type="text" id="username" required autocomplete="username" class="w-full px-4 py-3.5 bg-gray-50/50 dark:bg-zinc-800/50 border border-gray-200 dark:border-zinc-700 rounded-2xl text-sm outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition-all text-gray-900 dark:text-white placeholder-gray-400" placeholder="Viết liền không dấu">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="email">Địa chỉ Email</label>
                    <input type="email" id="email" required autocomplete="email" class="w-full px-4 py-3.5 bg-gray-50/50 dark:bg-zinc-800/50 border border-gray-200 dark:border-zinc-700 rounded-2xl text-sm outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition-all text-gray-900 dark:text-white placeholder-gray-400" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1.5" for="password">Mật khẩu</label>
                    <input type="password" id="password" required autocomplete="new-password" class="w-full px-4 py-3.5 bg-gray-50/50 dark:bg-zinc-800/50 border border-gray-200 dark:border-zinc-700 rounded-2xl text-sm outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/20 transition-all text-gray-900 dark:text-white placeholder-gray-400" placeholder="••••••••">
                </div>
                
                <button type="submit" id="submitBtn" class="w-full py-4 mt-2 bg-[#fbba00] hover:bg-[#e5aa00] text-[#1a1a2e] font-black text-sm uppercase tracking-wide rounded-2xl shadow-[0_4px_14px_rgba(251,186,0,0.3)] transition-all duration-300 hover:-translate-y-0.5 flex justify-center items-center gap-2">
                    Đăng Ký
                </button>
            </form>
            
            <div id="errorMsg" class="mt-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/50 rounded-xl text-[13px] font-semibold text-red-600 dark:text-red-400 text-center hidden"></div>
            <div id="successMsg" class="mt-4 p-3 bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-900/50 rounded-xl text-[13px] font-semibold text-green-600 dark:text-green-400 text-center hidden"></div>
            
            <div class="mt-8 border-t border-gray-100 dark:border-zinc-800/50 pt-5">
                <p class="text-center text-sm text-gray-500 dark:text-gray-400 font-medium">
                    Đã có tài khoản? <a href="login.html" class="text-amber-600 dark:text-amber-500 font-bold hover:underline decoration-2 underline-offset-4">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
    // -------------- BẠN HÃY ĐIỀN LINK CLOUDFLARE WORKER CỦA BẠN VÀO ĐÂY --------------
    const WORKER_URL = 'https://shopbanhanglkduongbinh.caovannamutt.workers.dev';
    
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();
        
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('errorMsg');
        const suc = document.getElementById('successMsg');
        
        err.classList.add('hidden');
        suc.classList.add('hidden');
        
        const oldText = btn.innerHTML;
        btn.innerHTML = '<span class="w-4 h-4 border-2 border-[#1a1a2e]/30 border-t-[#1a1a2e] rounded-full animate-spin inline-block"></span> Đang xử lý...';
        btn.disabled = true;
        btn.style.opacity = '0.8';
        
        try {
            // Gửi dữ liệu Đăng Ký đến Cloudflare Worker
            const res = await fetch(WORKER_URL + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, email: email, password: pass })
            });

            if (WORKER_URL.includes('YOUR_WORKER_URL')) {
                setTimeout(() => {
                    err.textContent = 'Bạn chưa thay Link API Cloudflare Worker vào file register.html kìa!';
                    err.classList.remove('hidden');
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.innerHTML = oldText;
                }, 1000);
                return;
            }

            const data = await res.json().catch(() => null);
            
            if (res.ok && data && data.success) {
                // Đăng ký thành công
                suc.textContent = 'Đăng ký thành công! Đang chuyển hướng...';
                suc.classList.remove('hidden');
                btn.innerHTML = 'Xong!';
                btn.style.background = '#22c55e'; // Màu xanh lá
                
                setTimeout(() => {
                    window.location.href = 'login.html'; 
                }, 1500);
            } else {
                err.textContent = (data && data.message) ? data.message : 'Tài khoản đã tồn tại hoặc xảy ra lỗi';
                err.classList.remove('hidden');
                btn.disabled = false;
                btn.style.opacity = '1';
                btn.innerHTML = oldText;
            }
        } catch(error) {
            err.textContent = 'Lỗi kết nối tới Máy chủ. Vui lòng thử lại sau.';
            err.classList.remove('hidden');
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.innerHTML = oldText;
        }
    });
    </script>
</body>
</html>
