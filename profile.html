<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport"/>
    <title>Hồ sơ cá nhân - Locket Gold</title>
    <link href="/assets/images/favicon.ico" rel="icon" type="image/x-icon"/>
    <link href="/assets/css/app-Bjnb32xO.css" rel="stylesheet"/>
    <link href="/assets/css/style.css" rel="stylesheet"/>
</head>
<body class="bg-[#FFFCEB] dark:bg-gray-900 text-text dark:text-gray-200 font-sans antialiased min-h-screen relative overflow-x-hidden">
    <!-- Nền ảnh -->
    <div class="fixed inset-0 z-[-2] pointer-events-none bg-cover bg-center bg-no-repeat scale-105" style="background-image: url('/assets/images/background-hero.webp');"></div>
    <div class="fixed inset-0 z-[-1] pointer-events-none bg-white/50 dark:bg-black/60 backdrop-blur-[3px]"></div>
    
    <!-- Navbar (Giữ nguyên từ index) -->
    <header class="sticky top-0 z-50 bg-[#fff5c3] shadow-sm">
        <div class="px-4 mx-auto max-w-7xl sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 lg:h-20">
                <div class="flex-shrink-0">
                    <a class="flex items-center" href="index.html">
                        <img alt="Locket Logo" class="h-8 lg:h-10 w-auto object-contain" src="/assets/images/logo-locket.png"/>
                    </a>
                </div>
                <nav class="hidden lg:flex lg:gap-8 xl:gap-12">
                    <a class="text-sm font-bold text-gray-900 hover:text-accent transition-colors" href="index.html">Trang chủ</a>
                    <a class="text-sm font-bold text-gray-600 hover:text-accent transition-colors" href="activate.html">Kích hoạt</a>
                    <a class="text-sm font-bold text-gray-600 hover:text-accent transition-colors" href="index.html#pricing">Bảng giá</a>
                    <a class="text-sm font-bold text-gray-600 hover:text-accent transition-colors" href="activate.html">Hướng dẫn</a>
                    <a class="text-sm font-bold text-gray-600 hover:text-accent transition-colors" href="index.html#faq">Hỗ trợ</a>
                </nav>
                <div class="flex items-center gap-4">
                    <a href="login.html" class="flex items-center justify-center gap-2 px-5 py-2.5 bg-accent hover:bg-accent-dark text-white text-sm font-semibold rounded-full shadow-sm transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Đăng nhập
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 relative z-10">
        <!-- Title -->
        <div class="mb-8">
            <h1 class="text-2xl font-black text-gray-900 dark:text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                Hồ sơ cá nhân
            </h1>
            <p class="text-sm text-gray-500 mt-1 ml-8">Quản lý thông tin tài khoản của bạn</p>
        </div>

        <!-- Banner Card -->
        <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl rounded-[24px] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] mb-8 flex flex-col items-center border border-white/50">
            <img id="pf-avatar" src="/assets/images/default-avatar.png" class="w-20 h-20 rounded-full object-cover shadow-md mb-4 bg-gray-100" />
            <h2 id="pf-display-name" class="text-xl font-bold text-gray-900">Name Here</h2>
            <p id="pf-username" class="text-sm text-gray-500 mb-2">@username</p>
            <span class="px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full border border-blue-100">Chưa kích hoạt</span>
        </div>

        <!-- Flex Columns -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left: Info -->
            <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl rounded-[24px] p-6 sm:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50">
                <h3 class="text-base font-bold text-gray-900 flex items-center gap-2 mb-6">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Thông tin cá nhân
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Tên hiển thị</label>
                        <input type="text" id="input-display-name" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-amber-400 transition-all text-gray-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
                        <input type="text" id="input-username" readonly class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm outline-none text-gray-500 cursor-not-allowed">
                        <p class="text-[11px] text-gray-400 mt-1">Username không thể thay đổi</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Email</label>
                        <input type="email" id="input-email" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-amber-400 transition-all text-gray-900">
                    </div>
                    <div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-100">
                        <span class="text-xs text-gray-400 font-medium">Ngày tạo</span>
                        <span class="text-xs text-gray-500 font-semibold" id="pf-date">01/01/2026 00:00</span>
                    </div>
                    <button class="w-full mt-4 py-3 bg-[#fbba00] hover:bg-[#e5aa00] text-[#1a1a2e] font-bold text-sm tracking-wide rounded-xl shadow-[0_4px_14px_rgba(251,186,0,0.3)] transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                        Lưu thay đổi
                    </button>
                </div>
            </div>

            <!-- Right: Password -->
            <div class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl rounded-[24px] p-6 sm:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 h-max">
                <h3 class="text-base font-bold text-gray-900 flex items-center gap-2 mb-6">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Đổi mật khẩu
                </h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu hiện tại</label>
                        <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-amber-400 transition-all text-gray-900 placeholder-gray-300" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu mới</label>
                        <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-amber-400 transition-all text-gray-900 placeholder-gray-300" placeholder="••••••••">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Xác nhận mật khẩu mới</label>
                        <input type="password" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm outline-none focus:border-amber-400 transition-all text-gray-900 placeholder-gray-300" placeholder="••••••••">
                    </div>
                    <button class="w-full mt-4 py-3 bg-gray-900 hover:bg-black text-white font-bold text-sm tracking-wide rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        Cập nhật mật khẩu
                    </button>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Alpine JS is needed for some components. Ensure we have the script runner -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="/assets/js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('user');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    const displayName = user.displayName || user.username;
                    
                    document.getElementById('pf-display-name').textContent = displayName;
                    document.getElementById('pf-username').textContent = '@' + user.username;
                    
                    document.getElementById('input-display-name').value = displayName;
                    document.getElementById('input-username').value = user.username;
                    document.getElementById('input-email').value = user.email || '';
                    
                    // Lấy random avatar theo tên
                    document.getElementById('pf-avatar').src = `https://ui-avatars.com/api/?name=${user.username}&background=random&color=fff&size=200`;
                    
                    // Ngày tạo fake hiện tại
                    const now = new Date();
                    document.getElementById('pf-date').textContent = now.toLocaleDateString('vi-VN') + ' ' + now.getHours() + ':' + now.getMinutes().toString().padStart(2,'0');

                } catch(e) {}
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
